name: Replay archive verified normalization
on:
  workflow_dispatch:
    inputs:
      source_runs:
        description: JSON array of existing recording run IDs
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: replay-artifact-resplit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source_run: ${{ fromJSON(inputs.source_runs) }}
    env:
      SOURCE_RUN: ${{ matrix.source_run }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/polymarket-5m
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Verify source and normalize with existing replay pipeline
        id: normalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYCODE'
          def main():
              import hashlib,json,os,shutil,subprocess,sys,zipfile
              from pathlib import Path
              sys.path.insert(0,str(Path('research/polymarket-5m').resolve()))
              import artifact_parts,replay_lab,replay_dataset
              repo=os.environ['GITHUB_REPOSITORY']; source_run=int(os.environ['SOURCE_RUN'])
              work=Path('recording');work.mkdir();used=[]
              def gh(endpoint,path=None):
                  if path:
                      with path.open('wb') as out: subprocess.run(['gh','api',endpoint],stdout=out,check=True,timeout=300)
                      return
                  return json.loads(subprocess.check_output(['gh','api',endpoint],timeout=60))
              def obtain(item,extract=False):
                  assert not item['expired'] and item['workflow_run']['id']==source_run
                  path=work/(str(item['id'])+'.zip');gh(f'repos/{repo}/actions/artifacts/{item["id"]}/zip',path)
                  assert path.stat().st_size==item['size_in_bytes']
                  digest=artifact_parts.digest_file(path)
                  assert item.get('digest')=='sha256:'+digest,'missing or incorrect original artifact SHA256'
                  used.append({k:item[k] for k in ('id','name','size_in_bytes','digest')})
                  if extract:
                      with zipfile.ZipFile(path) as z:
                          assert z.testzip() is None
                          for info in z.infolist():
                              assert Path(info.filename).name==info.filename and info.filename not in ('','.','..')
                              target=work/info.filename
                              with z.open(info) as src,target.open('xb') as dst:shutil.copyfileobj(src,dst,1024**2)
                      path.unlink()
                  return path
              items=gh(f'repos/{repo}/actions/runs/{source_run}/artifacts?per_page=100')['artifacts']
              items=[r for r in items if not r['expired']]
              legacy=[r for r in items if r['name']==f'recording-{source_run}']
              publication=None;source_manifest=None
              if legacy:
                  assert len(legacy)==1
                  source=obtain(legacy[0]);source_digest=artifact_parts.digest_file(source)
              else:
                  index=next(r for r in items if r['name']==f'recording-{source_run}-index')
                  obtain(index,True)
                  publication=json.loads((work/'publish-index.json').read_text())
                  assert publication['schema']=='research-archive-publication-v1'
                  assert publication['prefix']==f'recording-{source_run}' and int(publication['run_id'])==source_run
                  assert publication['status']=='all_parts_uploaded'
                  source_manifest=artifact_parts.read_manifest(work/'manifest.json',publication['manifest_sha256'])
                  assert publication['source_sha256']==source_manifest['source_sha256']
                  assert publication['source_bytes']==source_manifest['source_bytes']
                  assert len(publication['parts'])==len(source_manifest['parts'])
                  for part,stated in zip(source_manifest['parts'],publication['parts']):
                      item=next(r for r in items if str(r['id'])==str(stated['artifact_id']))
                      assert item['name']==stated['artifact_name']==f'recording-{source_run}-part-{part["index"]:05d}'
                      assert all(stated[k]==part[k] for k in ('index','name','zip_bytes','zip_sha256'))
                      obtain(item,True)
                  source=work/source_manifest['source_name']
                  assert source.parent==work
                  artifact_parts.assemble(work/'manifest.json',work,source,publication['manifest_sha256'])
                  source_digest=source_manifest['source_sha256']
              result=replay_lab.import_inputs([source],Path('normalize-cache'),'raw',allow_unresolved_history=True)
              cache=Path(result['cache_path']);manifest=replay_dataset.verify_cache(cache)
              raw=Path('normalize-cache/raw')/result['raw_imports'][0]['cache_key']
              raw_manifest=json.loads((raw/'manifest.json').read_text())
              assert raw_manifest['identity']['inputs']['archive_sha256']==source_digest
              module_root=Path('research/polymarket-5m').resolve()
              codes={Path(m.__file__).name:artifact_parts.digest_file(m.__file__) for m in list(sys.modules.values())
                     if getattr(m,'__file__',None) and Path(m.__file__).resolve().parent==module_root and str(m.__file__).endswith('.py')}
              provenance={'schema':'replay-normalized-publication-v1','source_run_id':source_run,
                          'transport_run_id':int(os.environ['GITHUB_RUN_ID']),'transport_commit':os.environ['GITHUB_SHA'],
                          'repository':repo,'source_artifacts':used,'source_archive_sha256':source_digest,
                          'source_archive_bytes':source.stat().st_size,'source_publication':publication,
                          'source_manifest':source_manifest,'normalizer_code_sha256':codes,'raw_manifest':raw_manifest,
                          'dataset_key':manifest['dataset_key'],'dataset_manifest_sha256':artifact_parts.digest_file(cache/'manifest.json'),
                          'events_sha256':manifest['tape_sha256'],'recording_coverage_verified':False}
              (cache/'normalized-provenance.json').write_text(json.dumps(provenance,indent=2,allow_nan=False)+'\n')
              assert sum(p.stat().st_size for p in cache.iterdir())<490*1024**2,'normalized cache exceeds single artifact limit'
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('cache_path='+str(cache)+'\n')
              print(json.dumps({'source_run_id':source_run,'dataset_key':manifest['dataset_key'],'tape_bytes':manifest['tape_bytes'],
                                'coverage':manifest['coverage']},allow_nan=False))
          
          try:
              main()
          except Exception as exc:
              import json, os, traceback
              from pathlib import Path
              Path('normalization-failure.json').write_text(json.dumps({
                  'schema':'replay-normalization-failure-v1','source_run_id':int(os.environ['SOURCE_RUN']),
                  'transport_run_id':int(os.environ['GITHUB_RUN_ID']),'transport_commit':os.environ['GITHUB_SHA'],
                  'repository':os.environ['GITHUB_REPOSITORY'],'error':str(exc),'error_type':type(exc).__name__,
                  'traceback':traceback.format_exc()},indent=2)+'\n')
              raise
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: replay-normalized-${{ matrix.source_run }}
          path: ${{ steps.normalize.outputs.cache_path }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: replay-normalization-failure-${{ matrix.source_run }}
          path: normalization-failure.json
          retention-days: 30
          if-no-files-found: ignore
