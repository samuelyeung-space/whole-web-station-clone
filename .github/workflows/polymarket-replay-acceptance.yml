name: Polymarket offline replay acceptance
on:
  push:
    branches: [codex/btc5m-mine500-20261010]
    paths:
      - .github/workflows/polymarket-replay-acceptance.yml
      - research/polymarket-5m/replay_cli.py
      - research/polymarket-5m/test_replay_cli.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-replay-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/polymarket-5m
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install numpy==2.2.6
      - name: Export replay source only
        run: |
          mkdir -p replay-delivery/source
          find research/polymarket-5m -maxdepth 1 -type f \( -name '*.py' -o -name '*.md' \) -exec cp '{}' replay-delivery/source/ \;
          git rev-parse HEAD > replay-delivery/SOURCE_COMMIT.txt
      - name: Offline regression tests
        working-directory: research/polymarket-5m
        run: |
          set -o pipefail
          python -m unittest discover -s . -p 'test_replay_*.py' -v 2>&1 | tee "$GITHUB_WORKSPACE/replay-delivery/replay-tests.txt"
          python -m unittest test_legacy_recording_cache -v 2>&1 | tee "$GITHUB_WORKSPACE/replay-delivery/legacy-tests.txt"
      - name: End-to-end demo and verified repeat cache
        working-directory: research/polymarket-5m
        run: |
          set -o pipefail
          python replay_cli.py doctor > "$GITHUB_WORKSPACE/replay-delivery/doctor.json"
          python replay_cli.py demo --work "$GITHUB_WORKSPACE/replay-delivery/demo" | tee "$GITHUB_WORKSPACE/replay-delivery/demo-first.json"
          python replay_cli.py demo --work "$GITHUB_WORKSPACE/replay-delivery/demo" | tee "$GITHUB_WORKSPACE/replay-delivery/demo-repeat.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-replay-source-and-tests
          path: replay-delivery
          retention-days: 7
